<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitrine</title>
  <meta name="description" content="Vitrine — a native macOS app for personal knowledge management, research, note-taking, and continuous learning.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&family=Inter:wght@400;500&display=swap">
  <style>
    /* Tokens from design/vitrine-design-system-brief.md — dark default, cream playbill in light. */
    :root {
      color-scheme: dark;
      --color-bg: #09111D;
      --color-bg-surface: #121A25;
      --color-fg: #D0D8E4;
      --color-fg-secondary: #B2BBC9;
      --color-fg-muted: #9099A7;
      --color-accent: #E5B64A;
      --color-link: #9ABFFA;
      --color-line: #2C333E;
      --color-focus: #E5B64A;
      --color-primary: #2062C7;
      --color-primary-hover: #2E70D6;
      --color-primary-active: #0C49A0;
      --color-on-primary: #FFFFFF;
      --font-display: 'Josefin Sans', Futura, 'Century Gothic', sans-serif;
      --font-sans: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      --radius-md: 3px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --color-bg: #F7F1E6;
        --color-bg-surface: #FDFAF3;
        --color-fg: #09111D;
        --color-fg-secondary: #2C333E;
        --color-fg-muted: #545B66;
        --color-accent: #634A0D;
        --color-link: #0C49A0;
        --color-line: #B2BBC9;
        --color-focus: #836202;
        --color-primary-hover: #0C49A0;
        --color-primary-active: #053274;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-sans);
      line-height: 1.5;
    }
    main {
      max-width: 34rem;
      padding: 4rem 1.5rem;
      text-align: center;
    }
    .wordmark {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-accent);
    }
    .rule {
      width: 4rem;
      height: 1px;
      margin: 1.5rem auto;
      background: var(--color-line);
      border: 0;
    }
    p { margin: 0 0 1rem; color: var(--color-fg-secondary); }
    .status {
      font-size: 0.8125rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-fg-muted);
    }
    a { color: var(--color-link); }
    .button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.625rem 1.25rem;
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: var(--color-on-primary);
      font-weight: 500;
      text-decoration: none;
    }
    .button:hover { background: var(--color-primary-hover); }
    .button:active { background: var(--color-primary-active); }
    :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1 class="wordmark">Vitrine</h1>
    <hr class="rule">
    <p>A native macOS app for personal knowledge management, research,
      note-taking, and continuous learning — in the tradition of Obsidian
      and LogSeq.</p>
    <p class="status">In development · no release yet</p>
    <a class="button" href="https://github.com/tacomancy/vitrine">Follow along on GitHub</a>
  </main>
</body>
</html>
