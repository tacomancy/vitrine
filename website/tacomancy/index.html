<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Moved to /</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://tacomancy.com/">
  <!-- This address moved when Tacomancy became the homepage (ADR 0011). The script carries a #hash across, which a meta refresh cannot; the meta refresh is the fallback without JavaScript. -->
  <script>location.replace("/" + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=/">
</head>
<body>
  <p>This page is now at <a href="/">tacomancy.com/</a>.</p>
</body>
</html>
