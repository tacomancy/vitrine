packages:
  - packages/*

# pnpm refuses to run install scripts it has not been told about. esbuild
# needs its postinstall for the platform binary; electron fetches its own on
# first launch but is listed so a future postinstall is not silently skipped.
# electron-winstaller (pulled in by electron-builder) only fetches a Windows
# installer binary in its postinstall; nothing here builds for Windows.
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true

minimumReleaseAgeExclude:
  - "@types/node@24.13.6"
