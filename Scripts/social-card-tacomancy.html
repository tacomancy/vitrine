<!doctype html>
<html lang="en">
  <head>
    <!-- Source of website/social-tacomancy.png, the Open Graph image for the studio's pages (/ and /skills/). Rendered by Scripts/render-social-card.sh; not a page on the site. -->
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300&family=Inter:wght@400&family=IBM+Plex+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="../docs/reference/branding/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: var(--color-bg);
        color: var(--color-fg);
        font-family: var(--font-sans);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 var(--space-9);
        box-sizing: border-box;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: var(--space-5);
        margin-bottom: var(--space-7);
      }
      .wordmark {
        font-family: var(--font-display);
        font-weight: 300;
        font-size: var(--text-5xl);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--color-accent);
        transform: translateY(5px);
      }
      h1 {
        margin: 0 0 var(--space-5);
        font-family: var(--font-display);
        font-weight: 300;
        font-size: var(--text-6xl);
        line-height: var(--leading-tight);
        letter-spacing: var(--tracking-display);
        color: var(--color-fg);
        max-width: 720px;
      }
      p {
        margin: 0;
        font-size: var(--text-2xl);
        line-height: var(--leading-normal);
        color: var(--color-fg-secondary);
        max-width: 900px;
      }
      .eyebrow {
        position: absolute;
        right: var(--space-9);
        bottom: var(--space-7);
        font-family: var(--font-mono);
        font-size: var(--text-lg);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
        color: var(--color-fg-muted);
      }
    </style>
  </head>
  <body>
    <div class="lockup">
      <img
        src="../website/marks/fold.svg"
        width="64"
        height="64"
        alt=""
      /><span class="wordmark">Tacomancy</span>
    </div>
    <h1>The study of taco-based magic.</h1>
    <p>
      A one-person studio. Vitrine, a local-first research workspace, and
      agent skills distilled from how it is run.
    </p>
    <div class="eyebrow">tacomancy.com</div>
  </body>
</html>
