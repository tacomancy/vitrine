# One required check on pull requests to main. Today it guards the guidance
# tier (Scripts/check-guidance.sh). The test suite is added as a second job,
# and a second required check, the moment the stack lands (docs/architecture.md).
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the guidance tier
        run: Scripts/check-guidance.sh "origin/${{ github.base_ref }}"
