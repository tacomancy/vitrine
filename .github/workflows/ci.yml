# Two required checks on pull requests to main: the guidance tier
# (Scripts/check-guidance.sh) and the test suite (lint, typecheck, vitest).
#
# The test job runs on macOS, and must stay there. Vitrine ships macOS-only
# and its Watcher is built on FSEvents (ADR 0013). Linux has no FSEvents, and
# its stand-in goes permanently deaf to a page the app has written atomically,
# so Watcher tests hang there on an event that never arrives. The 10x runner
# minutes are the known price of a gate that can see the shipped platform's
# behaviour. ADR 0029 has the mechanism and the measurements.
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the guidance tier
        run: Scripts/check-guidance.sh "origin/${{ github.base_ref }}"

  test:
    # macOS for FSEvents -- see the header comment and ADR 0029.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Electron's binary is not needed to lint, typecheck, or test.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
