# ADR 0004: the public site at tacomancy.com is built from website/ by
# Scripts/build-site.sh and deployed here on every push to main that touches
# it or its inputs. Separate from ci.yml so that file keeps describing the
# merge gate only. The custom domain is bound in the repository's Pages
# settings, not by a CNAME file — Actions-based deploys ignore one.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/reference/prototypes/**
      - docs/reference/branding/**
      - Scripts/build-site.sh
      - Scripts/rebrand-prototypes.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: Scripts/build-site.sh build/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
