# ADR 0010: the public site at tacomancy.com is the contents of site/, deployed
# by this workflow on every push to main. Separate from ci.yml so ADR 0006's
# "one job, pull requests only" still describes CI. The custom domain is set in
# the repository's Pages settings, not by a CNAME file — Actions-based deploys
# ignore one.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
